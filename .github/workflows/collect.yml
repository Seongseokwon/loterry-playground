name: Collect lotto draws

on:
  schedule:
    # Saturday 21:00~23:59 KST, every 10 minutes.
    - cron: "*/10 12-14 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-draw-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect the latest draw
        run: pnpm collect:latest

      - name: Validate collected lotto data
        run: node --input-type=module -e "import { readFile } from 'node:fs/promises'; import { validateDrawCollection } from './lib/collector/source.mjs'; const draws = JSON.parse(await readFile('data/lotto-draws.json', 'utf8')); const summary = validateDrawCollection(draws); console.log('Validated ' + summary.count + ' rounds (' + summary.firstRound + '-' + summary.latestRound + ').');"

      - name: Commit updated draw data
        run: |
          if git diff --quiet -- data/lotto-draws.json; then
            echo "No draw data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto-draws.json
          git commit -m "chore(data): update latest lotto draw"
          git push
