name: Collect lotto draws

on:
  schedule:
    # Saturday 21:00-23:59 KST (12:00-14:59 UTC), every 10 minutes.
    - cron: "*/10 12-14 * * 6"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect latest draw
        env:
          COLLECT_URL: ${{ secrets.COLLECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$COLLECT_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${COLLECT_URL}/api/internal/collect"
